  <script>
    function actualizarReloj() {
      const ahora = new Date();
      document.getElementById('clock').textContent = meFormatoHora(ahora);
      document.getElementById('date').textContent = ahora.toLocaleDateString('es-AR');
    }
    function meFormatoHora(date) {
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    // CONTROL DEL MENÚ LATERAL
    function toggleMenuBoton() {
      if (window.innerWidth < 1024) {
        const sidebar = document.getElementById('sidebarNav');
        const overlay = document.getElementById('mobileOverlay');

        if (sidebar.classList.contains('-translate-x-full')) {
          sidebar.classList.remove('-translate-x-full');
          overlay.classList.remove('hidden');
        } else {
          cerrarMenuMobile();
        }
      } else {
        const sidebar = document.getElementById('sidebarNav');
        sidebar.classList.toggle('sidebar-collapsed');
      }
    }

    function cerrarMenuMobile() {
      const sidebar = document.getElementById('sidebarNav');
      const overlay = document.getElementById('mobileOverlay');
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    }

    function ejecutarAccionModulo(nombreModulo) {
      if (window.innerWidth < 1024) {
        cerrarMenuMobile();
      }
      if (nombreModulo === 'inicio') {
        cargarInicio();
      } else {
        cargarModulo(nombreModulo);
      }
    }

    function toggleNotificaciones() {
      document.getElementById('popoverNotif').classList.toggle('hidden');
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function toggleTema() {
      const body = document.getElementById('mainBody');
      const iconSun = document.getElementById('iconSun');
      const iconMoon = document.getElementById('iconMoon');

      if (body.classList.contains('theme-dark')) {
        body.classList.remove('theme-dark');
        body.classList.add('theme-light');
        iconSun.classList.add('hidden');
        iconMoon.classList.remove('hidden');
      } else {
        body.classList.remove('theme-light');
        body.classList.add('theme-dark');
        iconMoon.classList.add('hidden');
        iconSun.classList.remove('hidden');
      }
    }

    function toggleSubmenu(idSubmenu, idArrow) {
      const sidebar = document.getElementById('sidebarNav');
      if (window.innerWidth >= 1024 && sidebar.classList.contains('sidebar-collapsed')) {
        sidebar.classList.remove('sidebar-collapsed');
      }

      const submenu = document.getElementById(idSubmenu);
      const arrow = document.getElementById(idArrow);
      
      if (submenu.classList.contains('hidden')) {
        submenu.classList.remove('hidden');
        if (arrow) arrow.style.transform = 'rotate(180deg)';
      } else {
        submenu.classList.add('hidden');
        if (arrow) arrow.style.transform = 'rotate(0deg)';
      }
    }

    function ejecutarLoginEscritorio() {
      const user = document.getElementById('desktopDni').value;
      const pass = document.getElementById('desktopPass').value;

      if (user && pass) {
        // OCULTAR LOGIN Y MOSTRAR SIDEBAR Y HEADER
        document.getElementById('modalDesktopLogin').classList.add('hidden');
        document.getElementById('sidebarNav').classList.remove('hidden');
        document.getElementById('mainHeader').classList.remove('hidden');
        document.getElementById('lblUserNombre').textContent = user === '100' ? 'Super Admin' : user;
        
        // INICIALIZAR LA VISTA DE LA APP
        inicializarRutaHash();
      } else {
        alert('Ingresa las credenciales');
      }
    }

    function cerrarSesion() {
      document.getElementById('modalDesktopLogin').classList.remove('hidden');
      document.getElementById('sidebarNav').classList.add('hidden');
      document.getElementById('mainHeader').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
