<div class="space-y-6">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
      <h2 class="text-lg font-black">Gestión de Legajos de Estudiantes</h2>
      <p class="text-xs text-slate-400">Consulta y alta de legajos estudiantiles.</p>
    </div>
  </div>

  <!-- Formulario estilizado -->
  <form id="form-alumno" class="theme-card border p-5 rounded-2xl space-y-4">
    <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-500">Registrar Nuevo Alumno</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <input type="text" id="legajo" placeholder="Legajo (ej: ALU-003)" required class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-2.5 text-xs outline-none focus:border-emerald-500">
      <input type="text" id="nombre" placeholder="Nombre" required class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-2.5 text-xs outline-none focus:border-emerald-500">
      <input type="text" id="apellido" placeholder="Apellido" required class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-2.5 text-xs outline-none focus:border-emerald-500">
      <input type="text" id="dni" placeholder="DNI" required class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-2.5 text-xs outline-none focus:border-emerald-500">
    </div>
    <div class="flex justify-end">
      <button type="submit" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-md transition-all cursor-pointer">Guardar Legajo</button>
    </div>
  </form>

  <!-- Tabla elegante -->
  <div class="theme-card border rounded-2xl overflow-hidden shadow-lg">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs border-collapse">
        <thead>
          <tr class="border-b border-slate-700/50 bg-slate-800/30 text-slate-400 uppercase font-bold text-[10px]">
            <th class="p-3.5">Legajo</th>
            <th class="p-3.5">Nombre</th>
            <th class="p-3.5">Apellido</th>
            <th class="p-3.5">DNI</th>
            <th class="p-3.5">Estado</th>
          </tr>
        </thead>
        <tbody id="tabla-alumnos" class="divide-y divide-slate-800/40">
          <!-- Carga dinámica -->
        </tbody>
      </table>
    </div>
  </div>
</div>
